<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noite em Curitiba — As Melhores Baladas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
  
<center>
    <nav>
        <ul>
            <li><a href="./index.html">Baladas</a></li>
            <li><a href="./localizacao.html">Localização</a></li>
            <li><a href="./sobre.html">Sobre</a></li>        
            <li><a href="./avaliacoes.html">Avaliações</a></li>
            <li><a href="./contato.html">Entre em Contato</a></li>
        </ul>
    </nav>
</center>
<style>

section {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

h2 {
    text-align: center;
    font-size: 32px;
    color: rgb(122, 163, 161);
    font-weight: 100;
    margin-bottom: 30px;
}

form {
    background-color: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
}

label {
    font-size: 16px;
    color: #555;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
}

textarea {
    resize: none;
}

input[type="radio"],
input[type="checkbox"] {
    width: auto;
    margin-right: 8px;
}

input[type="submit"],
input[type="reset"] {
    width: 48%;
    background-color: rgb(122, 163, 161);
    color: white;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    font-size: 16px;
}

input[type="submit"]:hover,
input[type="reset"]:hover {
    background-color: darkcyan;
}

body {
    background-color: #fdfbf7;
    font-family: 'Poppins', sans-serif;
}

</style>
<section>

    <h2>Entre em Contato com a Balada</h2>

    <form>

        <label>Nome Completo:</label>
        <input type="text" name="nome" placeholder="Digite seu nome" required>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Digite seu email" required>

        <label>Telefone:</label>
        <input type="tel" name="telefone" placeholder="(41) 99999-9999">

        <label>Data do Evento:</label>
        <input type="date" name="data">

        <p>Qual área deseja reservar?</p>

        <input type="radio" name="area" value="pista">
        <label>Pista</label><br>

        <input type="radio" name="area" value="vip">
        <label>Área VIP</label><br>

        <input type="radio" name="area" value="camarote">
        <label>Camarote</label>

        <p>O que você deseja no evento?</p>

        <input type="checkbox" name="openbar">
        <label>Open Bar</label><br>

        <input type="checkbox" name="dj">
        <label>DJ Exclusivo</label><br>

        <input type="checkbox" name="aniversario">
        <label>Espaço para aniversário</label>

        <br><br>

        <label>Mensagem:</label>
        <textarea rows="5" placeholder="Digite sua mensagem"></textarea>

        <br><br>

        <input type="submit" value="Enviar">

        <input type="reset" value="Limpar">

    </form>

</section>

<footer>
  <p>© 2026 · Curitiba Nightlife · Desenvolvido por Lucas Pitt, Rubens, Pietro, Rodrigo e Pedro Latoch</p>
</footer>

</body>
</html>
